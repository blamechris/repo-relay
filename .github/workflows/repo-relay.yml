name: Repo Relay

on:
  pull_request:
    types: [opened, closed, reopened, synchronize, edited, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: ['CI']
    types: [completed]
  issue_comment:
    types: [created]
  issues:
    types: [opened, closed, reopened]
  release:
    types: [published]

# Serialize runs — concurrent jobs would race on the state cache
concurrency:
  group: repo-relay-${{ github.repository }}

jobs:
  notify:
    runs-on: ubuntu-latest
    # Cap hung runs: the concurrency group serializes runs, so an unbounded
    # hang would queue later notifications behind it for up to the 6h default
    timeout-minutes: 10
    # Skip this workflow's own actor (prevent self-trigger cascades), fork
    # PRs (no secrets access), and workflow_runs with no associated PRs.
    # Other bots (dependabot, Copilot) relay on purpose — their activity
    # belongs in the channel.
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event.pull_request.head.repo.full_name == github.repository ||
       github.event.pull_request == null) &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.pull_requests[0] != null)
    steps:
      # Persist SQLite state between runs. Per-run key: cache entries are
      # immutable, so a constant key would freeze state at the first run.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.repo-relay
          key: repo-relay-state-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            repo-relay-state-${{ github.repository }}-

      - uses: blamechris/repo-relay@0f126b57dc55fb6f31d3eec7f977d0d2c9fb77f2 # v1.3.0
        with:
          discord_bot_token: ${{ secrets.DISCORD_BOT_TOKEN }}
          channel_prs: ${{ secrets.DISCORD_CHANNEL_PRS }}
          channel_issues: ${{ secrets.DISCORD_CHANNEL_ISSUES || secrets.DISCORD_CHANNEL_PRS }}
          channel_releases: ${{ secrets.DISCORD_CHANNEL_RELEASES || secrets.DISCORD_CHANNEL_PRS }}
